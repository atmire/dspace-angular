@if (hasSubSections$ | async) {
  <div class="dso-button-menu mb-1" ngbDropdown container="body" placement="bottom-right" (openChange)="onOpenChange($event)">
    <div class="d-flex flex-row flex-nowrap"
      [ngbTooltip]="itemModel.text | translate" container="body">
      <button type="button"
              (keydown)="keyDown($event)"
              (keyup)="keyUp($event)"
              [attr.aria-controls]="expandableSectionId()"
              [attr.aria-label]="itemModel.text | translate"
              [dsBtnDisabled]="section.model?.disabled"
              aria-haspopup="menu" class="btn btn-dark btn-sm" ngbDropdownToggle data-test="dso-edit-menu-section-toggler" tabindex="0">
        <i class="fas fa-{{section.icon}} fa-fw" aria-hidden="true"></i>
      </button>
      <ul [id]="expandableSectionId()" ngbDropdownMenu class="dso-edit-menu-dropdown p-1" role="menu" [attr.aria-label]="itemModel.text | translate">
        @for (subSection of (subSections$ | async); track subSection) {
          <li class="nav-item nav-link d-flex flex-row p-2" role="presentation">
            @if (renderIcons$ | async) {
              <div class="me-2">
                @if (subSection.icon) {
                  <i class="fas fa-{{subSection.icon}} fa-fw" aria-hidden="true"></i>
                } @else {
                  <i class="fas fa-fw" aria-hidden="true"></i>
                }
              </div>
            }
            @if (sectionMap().get(subSection.id); as subSectionDTO) {
              <ng-container *ngComponentOutlet="subSectionDTO.component; injector: subSectionDTO.injector;"></ng-container>
            }
          </li>
        }
      </ul>
    </div>
  </div>
}
